<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2545; --navy-2:#12325C; --navy-3:#1B4079;
    --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-3:#EFF3F9;
    --line:#E3E8F0; --line-2:#EDF1F7; --ink:#0B2545; --ink-2:#4A5A72; --ink-3:#7C8AA0;
    --green:#0E9F6E; --green-bg:#E6F6EF; --amber:#C98A00; --amber-bg:#FDF4E1;
    --red:#D93B3B; --red-bg:#FDECEC; --blue:#2563C9;
    --shadow-lg:0 24px 64px -24px rgba(11,37,69,.45);
  }
  body{margin:0;font-family:Manrope,Helvetica,Arial,sans-serif}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  @keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
</style>
</helmet>

<div onClick="{{ onClose }}" style="position:fixed;inset:0;z-index:70;background:rgba(6,16,32,.62);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto;font-family:Manrope,Helvetica,Arial,sans-serif;color:var(--ink)">
  <div onClick="{{ stop }}" role="dialog" aria-modal="true" style="width:100%;max-width:1040px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);animation:popIn 220ms cubic-bezier(.22,.61,.36,1) both;overflow:hidden">

    <div style="padding:20px 22px;border-bottom:1px solid var(--line-2);background:var(--surface-2)">
      <div style="display:flex;gap:16px;align-items:flex-start;justify-content:space-between">
        <div style="min-width:0">
          <div style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-3)">{{ tipeLabel }}</div>
          <h3 style="margin:5px 0 0;font-size:19px;font-weight:800;letter-spacing:-.015em;text-wrap:pretty">{{ nama }}</h3>
          <div style="margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-3)">{{ kodeInfo }}</div>
        </div>
        <button type="button" onClick="{{ onClose }}" aria-label="Tutup" style="width:34px;height:34px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:15px;cursor:pointer" style-hover="border-color:var(--navy-3);color:var(--ink)">✕</button>
      </div>

      <div style="margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px">
        <sc-for list="{{ angka }}" as="a" hint-placeholder-count="4">
          <div>
            <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3)">{{ a.label }}</div>
            <div style="margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;letter-spacing:-.01em;color:{{ a.color }}">{{ a.value }}</div>
          </div>
        </sc-for>
      </div>

      <div style="margin-top:13px;height:12px;border-radius:99px;background:var(--surface-3);overflow:hidden;border:1px solid var(--line-2)">
        <div style="height:100%;border-radius:99px;background:{{ warna }};width:{{ bar }};transition:width 700ms cubic-bezier(.22,.61,.36,1)"></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:9px;flex-wrap:wrap;align-items:center">
        <span style="display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:99px;background:{{ badgeBg }};border:1px solid {{ warna }}">
          <span style="width:7px;height:7px;border-radius:50%;background:{{ warna }}"></span>
          <span style="font-size:11px;font-weight:700;color:{{ warna }}">{{ statusText }}</span>
        </span>
        <sc-if value="{{ adaRpd }}" hint-placeholder-val="{{ true }}">
          <span style="display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:99px;background:{{ rpdBg }};border:1px solid {{ rpdWarna }}">
            <span style="font-size:11px;font-weight:700;color:{{ rpdWarna }}">{{ rpdText }}</span>
          </span>
        </sc-if>
      </div>
    </div>

    <div style="padding:18px 22px">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between">
        <div style="min-width:0">
          <div style="font-size:13.5px;font-weight:800;letter-spacing:-.01em">Subkomponen</div>
          <div style="margin-top:2px;font-size:11.5px;color:var(--ink-3);text-wrap:pretty">Klik salah satu untuk melihat butir kegiatannya</div>
        </div>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3)">{{ jumlahSub }}</span>
      </div>

      <div style="margin-top:12px;display:grid;gap:8px">
        <sc-for list="{{ subs }}" as="s" hint-placeholder-count="3">
          <div style="border:1px solid {{ s.border }};border-radius:12px;overflow:hidden;background:{{ s.bg }}">
            <button type="button" onClick="{{ s.onClick }}" style="display:flex;width:100%;gap:12px;align-items:center;padding:12px 14px;background:transparent;border:none;cursor:pointer;text-align:left;font-family:Manrope" style-hover="background:var(--surface-2)">
              <span style="width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:10px;color:var(--ink-2);transform:{{ s.caret }};transition:transform 180ms ease">▶</span>
              <span style="flex:1;min-width:0">
                <span style="display:block;font-size:13px;font-weight:700;text-wrap:pretty">{{ s.nama }}</span>
                <span style="display:block;margin-top:2px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-3)">{{ s.meta }}</span>
              </span>
              <span style="flex:0 0 auto;text-align:right">
                <span style="display:block;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600">{{ s.pagu }}</span>
                <span style="display:block;margin-top:1px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:{{ s.warna }}">{{ s.pct }}</span>
              </span>
              <span style="width:74px;flex:0 0 auto;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;border:1px solid var(--line-2)">
                <span style="display:block;height:100%;background:{{ s.warna }};width:{{ s.bar }}"></span>
              </span>
            </button>

            <sc-if value="{{ s.terbuka }}" hint-placeholder-val="{{ false }}">
              <div style="padding:0 14px 14px;border-top:1px solid var(--line-2);animation:slideDown 200ms ease both">
                <div style="display:flex;flex-wrap:wrap;gap:6px;padding:12px 0">
                  <sc-for list="{{ s.filter }}" as="f" hint-placeholder-count="5">
                    <button type="button" onClick="{{ f.onClick }}" style="height:30px;padding:0 11px;border-radius:99px;border:1px {{ f.style }} {{ f.border }};background:{{ f.bg }};color:{{ f.color }};font-family:Manrope;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap" style-hover="filter:brightness(.97)">{{ f.label }} <span style="font-family:'IBM Plex Mono',monospace;opacity:.7">{{ f.jumlah }}</span></button>
                  </sc-for>
                </div>
                <dc-import name="ActivityTable" items="{{ s.butir }}" editable="{{ false }}" caption="{{ s.caption }}" empty-text="{{ s.kosong }}" hint-size="100%,260px"></dc-import>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="padding:14px 22px;background:var(--surface-2);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);min-width:0;overflow-wrap:anywhere">{{ footerNote }}</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a href="{{ waTu }}" target="_blank" rel="noopener" title="Tanyakan komponen ini ke Tim TU lewat WhatsApp" style="height:40px;display:inline-flex;align-items:center;gap:7px;padding:0 15px;border-radius:9px;background:#25D366;color:#08331C;font-family:Manrope;font-size:12.5px;font-weight:800;text-decoration:none;white-space:nowrap" style-hover="filter:brightness(.95);text-decoration:none;color:#08331C">✆ Hubungi TU</a>
      <button type="button" onClick="{{ onClose }}" style="height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:Manrope;font-size:12.5px;font-weight:600;cursor:pointer" style-hover="border-color:var(--navy-3)">Tutup</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1040,&quot;height&quot;:760},&quot;node&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;KomponenUtama&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
/**
 * SubcomponentModal — popup rincian KOMPONEN UTAMA.
 *
 * Struktur:
 *   1. Header  : komponen + pagu/realisasi/sisa + persentase (dan posisi vs RPD)
 *   2. Daftar subkomponen — tiap baris menampilkan pagu & % penyerapannya,
 *      dan DAPAT DIKLIK untuk membuka butir kegiatannya di bawah
 *   3. Butir kegiatan (read-only) + filter tahapan: Verifikasi TU, Verifikasi
 *      Keuangan, Perlu revisi, SP2D
 *
 * Props: node (komponen utama hasil buildTree), onClose
 *
 * ⚡ REAL-TIME: presentational — parent cukup mengirim `node` yang sudah diperbarui.
 */
const nf2 = new Intl.NumberFormat('id-ID');
const rp = (n) => 'Rp ' + nf2.format(Math.round(Number(n) || 0));
const TAHAP = [
  { key: 'TU', pendek: 'Verifikasi TU', color: 'var(--blue)', bg: 'rgba(37,99,201,.12)' },
  { key: 'KEUANGAN', pendek: 'Verifikasi Keuangan', color: 'var(--navy-3)', bg: 'rgba(27,64,121,.12)' },
  { key: 'SP2D', pendek: 'SP2D', color: 'var(--green)', bg: 'var(--green-bg)' }
];

const WA_TU_DEFAULT = '628123456789';   // dapat ditimpa lewat prop wa-tu / CONFIG.WA_TU

class Component extends DCLogic {
  state = { buka: null, filter: {}, waTu: WA_TU_DEFAULT };

  async componentDidMount() {
    // Nomor TU diambil dari CONFIG di data-source.js agar satu tempat saja.
    try {
      const ds = await import('./data-source.js');
      if (ds.CONFIG && ds.CONFIG.WA_TU) this.setState({ waTu: ds.CONFIG.WA_TU });
    } catch (e) { /* biarkan default */ }
  }

  norm(b) {
    const k = String(b.status || 'TU').toUpperCase();
    return k === 'REVISI' ? 'TU' : (TAHAP.some(t => t.key === k) ? k : 'TU');
  }
  rev(b) { return b.revisi === true || String(b.status || '').toUpperCase() === 'REVISI'; }
  warna(pct) {
    if (pct > 100) return 'var(--red)';
    if (pct >= 75) return 'var(--green)';
    if (pct >= 25) return 'var(--amber)';
    return 'var(--red)';
  }
  teks(pct) {
    if (pct > 100) return 'Over budget — realisasi melampaui pagu';
    if (pct >= 75) return 'Aman — penyerapan sesuai target';
    if (pct >= 25) return 'Waspada — penyerapan perlu dipacu';
    return 'Kritis — penyerapan masih rendah';
  }

  renderVals() {
    const n = this.props.node || { id: '', nama: '', pagu: 0, realisasi: 0, children: [], butir: [] };
    const pct = n.pagu > 0 ? (n.realisasi / n.pagu) * 100 : 0;
    const warna = this.warna(pct);
    const anak = n.children && n.children.length
      ? n.children
      : [{ ...n, nama: n.nama, butir: n.butir || [] }];   // komponen tanpa subkomponen

    const pctRpd = n.pctRpd || 0;
    const rpdWarna = pctRpd >= 95 ? 'var(--green)' : (pctRpd >= 70 ? 'var(--amber)' : 'var(--red)');

    return {
      stop: (e) => e.stopPropagation(),
      onClose: this.props.onClose || (() => {}),
      tipeLabel: 'Rincian Komponen Utama',
      nama: n.nama,
      kodeInfo: 'ID_Komponen: ' + n.id + ' · ' + anak.length + ' subkomponen',
      angka: [
        { label: 'Pagu', value: rp(n.pagu), color: 'var(--ink)' },
        { label: 'Realisasi', value: rp(n.realisasi), color: 'var(--green)' },
        { label: 'Sisa anggaran', value: rp(n.pagu - n.realisasi), color: 'var(--amber)' },
        { label: 'Penyerapan', value: pct.toFixed(2) + '%', color: warna }
      ],
      warna,
      bar: Math.min(100, pct).toFixed(1) + '%',
      badgeBg: pct >= 75 ? 'var(--green-bg)' : (pct >= 25 ? 'var(--amber-bg)' : 'var(--red-bg)'),
      statusText: this.teks(pct),
      adaRpd: !!n.adaRpd,
      rpdWarna,
      rpdBg: pctRpd >= 95 ? 'var(--green-bg)' : (pctRpd >= 70 ? 'var(--amber-bg)' : 'var(--red-bg)'),
      rpdText: 'Terhadap RPD s.d. bulan ini (' + rp(n.rpdSd || 0) + '): ' + pctRpd.toFixed(1) + '%',

      jumlahSub: anak.length + ' subkomponen · ' + (n.butir || []).length + ' butir kegiatan',
      subs: anak.map(c => {
        const cp = c.pagu > 0 ? (c.realisasi / c.pagu) * 100 : 0;
        const w = this.warna(cp);
        const buka = this.state.buka === c.id;
        const semua = c.butir || [];
        const aktif = this.state.filter[c.id] || 'ALL';
        const hitung = { ALL: semua.length, REVISI: semua.filter(b => this.rev(b)).length };
        TAHAP.forEach(t => { hitung[t.key] = semua.filter(b => this.norm(b) === t.key).length; });
        const tampil = aktif === 'ALL' ? semua
          : (aktif === 'REVISI' ? semua.filter(b => this.rev(b)) : semua.filter(b => this.norm(b) === aktif));
        const chip = (key, label, color, bg, dashed) => ({
          label, jumlah: hitung[key] || 0,
          onClick: () => this.setState(s => ({ filter: { ...s.filter, [c.id]: key } })),
          color: aktif === key ? '#fff' : color,
          bg: aktif === key ? color : bg,
          border: color,
          style: dashed ? 'dashed' : 'solid'
        });
        return {
          id: c.id,
          nama: c.nama,
          meta: c.id + ' · ' + semua.length + ' butir',
          pagu: rp(c.pagu),
          pct: cp.toFixed(1) + '%',
          warna: w,
          bar: Math.min(100, cp).toFixed(1) + '%',
          border: buka ? w : 'var(--line)',
          bg: buka ? 'var(--surface-2)' : 'var(--surface)',
          caret: buka ? 'rotate(90deg)' : 'none',
          terbuka: buka,
          onClick: () => this.setState(s => ({ buka: s.buka === c.id ? null : c.id })),
          filter: [
            chip('ALL', 'Semua', 'var(--navy-3)', 'var(--surface-3)'),
            chip('TU', 'Verifikasi TU', 'var(--blue)', 'rgba(37,99,201,.12)'),
            chip('KEUANGAN', 'Verifikasi Keuangan', 'var(--navy-3)', 'rgba(27,64,121,.12)'),
            chip('REVISI', '⚑ Perlu revisi', 'var(--red)', 'var(--red-bg)', true),
            chip('SP2D', 'SP2D', 'var(--green)', 'var(--green-bg)')
          ],
          butir: tampil,
          caption: 'Realisasi ' + rp(c.realisasi) + ' · sisa ' + rp(c.pagu - c.realisasi) +
                   ' · menampilkan ' + tampil.length + ' dari ' + semua.length + ' butir',
          kosong: semua.length
            ? 'Tidak ada butir pada filter ini.'
            : 'Admin/TU belum mencatat berkas untuk subkomponen ini.'
        };
      }),
      waTu: 'https://wa.me/' + (this.props.waTu || this.state.waTu) + '?text=' + encodeURIComponent(
        'Halo Tim TU Pusdatin KP, saya ingin menanyakan penyerapan anggaran:\n\n' +
        '• Komponen: ' + n.id + ' — ' + n.nama + '\n' +
        '• Pagu: ' + rp(n.pagu) + '\n' +
        '• Realisasi: ' + rp(n.realisasi) + ' (' + pct.toFixed(2) + '%)\n' +
        '• Sisa: ' + rp(n.pagu - n.realisasi) + '\n\nPertanyaan saya: '
      ),
      footerNote: (n.butir || []).length + ' butir kegiatan · ' +
                  (n.butir || []).filter(b => this.norm(b) === 'SP2D').length + ' sudah SP2D · sisa ' + rp(n.pagu - n.realisasi)
    };
  }
}
</script>
</body>
</html>
