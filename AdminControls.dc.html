<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2545; --navy-3:#1B4079; --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-3:#EFF3F9;
    --line:#E3E8F0; --line-2:#EDF1F7; --ink:#0B2545; --ink-2:#4A5A72; --ink-3:#7C8AA0;
    --green:#0E9F6E; --green-bg:#E6F6EF; --amber:#C98A00; --amber-bg:#FDF4E1;
    --red:#D93B3B; --red-bg:#FDECEC; --blue:#2563C9;
  }
  body{margin:0;font-family:Manrope,Helvetica,Arial,sans-serif;background:var(--surface-2)}
  @keyframes spin2{to{transform:rotate(360deg)}}
</style>
</helmet>

<div style="font-family:Manrope,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden">

  <div style="padding:16px 18px;border-bottom:1px solid var(--line-2);background:var(--surface-2);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
    <div style="min-width:0">
      <div style="font-size:14.5px;font-weight:800;letter-spacing:-.01em">{{ judul }}</div>
      <div style="margin-top:2px;font-size:12px;color:var(--ink-2);text-wrap:pretty">{{ subjudul }}</div>
    </div>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;border-radius:8px;background:{{ modeBg }};border:1px solid {{ modeColor }};color:{{ modeColor }};white-space:nowrap">{{ modeLabel }}</span>
  </div>

  <div style="padding:18px;display:grid;gap:16px">

    <div>
      <label style="display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px">Subkomponen <span style="color:var(--red)">*</span></label>
      <select ref="{{ refKomponen }}" value="{{ vKomponen }}" onChange="{{ onKomponen }}" style="width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:Manrope;font-size:13px;cursor:pointer;outline:none" style-focus="border-color:var(--navy-3)">
        <option value="">— Pilih subkomponen —</option>
        <sc-for list="{{ komponenOptions }}" as="k" hint-placeholder-count="6">
          <option value="{{ k.value }}">{{ k.label }}</option>
        </sc-for>
      </select>
    </div>

    <div>
      <label style="display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px">Nomor Dokumen / Surat <span style="color:var(--red)">*</span></label>
      <input type="text" value="{{ vId }}" onInput="{{ onId }}" disabled="{{ isEditing }}" placeholder="Contoh: DIK-KU.03.01-23" style="width:100%;height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:{{ idBg }};color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px;outline:none" style-focus="border-color:var(--navy-3)">
      <div style="margin-top:5px;font-size:11.5px;color:var(--ink-3);text-wrap:pretty">{{ idHint }}</div>
    </div>

    <div>
      <label style="display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px">Nama Butir Kegiatan <span style="color:var(--red)">*</span></label>
      <input type="text" value="{{ vNama }}" onInput="{{ onNama }}" placeholder="Contoh: SPPD monitoring wilayah IV" style="width:100%;height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:Manrope;font-size:13px;outline:none" style-focus="border-color:var(--navy-3)">
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px">
      <div>
        <label style="display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px">Nominal <span style="color:var(--red)">*</span></label>
        <div style="position:relative">
          <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-3)">Rp</span>
          <input type="text" inputmode="numeric" value="{{ vNominal }}" onInput="{{ onNominal }}" placeholder="0" style="width:100%;height:42px;padding:0 12px 0 38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;text-align:right;outline:none" style-focus="border-color:var(--navy-3)">
        </div>
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px">Tanggal Terima Berkas</label>
        <input type="date" value="{{ vTanggal }}" onChange="{{ onTanggal }}" style="width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:Manrope;font-size:13px;outline:none" style-focus="border-color:var(--navy-3)">
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px">Tahapan Awal</label>
        <select ref="{{ refStatus }}" value="{{ vStatus }}" onChange="{{ onStatus }}" style="width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:Manrope;font-size:13px;cursor:pointer;outline:none" style-focus="border-color:var(--navy-3)">
          <sc-for list="{{ statusOptions }}" as="s" hint-placeholder-count="3">
            <option value="{{ s.value }}">{{ s.label }}</option>
          </sc-for>
        </select>
      </div>
    </div>

    <div style="padding:13px 15px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2)">
      <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)">PIC Kegiatan (penanggung jawab) <span style="color:var(--red)">*</span></div>
      <div style="margin-top:3px;font-size:11.5px;line-height:1.55;color:var(--ink-2);text-wrap:pretty">Nama dan nomor WA wajib diisi — dipakai admin untuk memberi tahu status berkas langsung dari daftar butir. NIP opsional bagi non-pegawai.</div>
      <div style="margin-top:11px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">
        <div>
          <label style="display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px">Nama PIC <span style="color:var(--red)">*</span></label>
          <input type="text" value="{{ vPicNama }}" onInput="{{ onPicNama }}" placeholder="Nama lengkap" style="width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:Manrope;font-size:13px;outline:none" style-focus="border-color:var(--navy-3)">
        </div>
        <div>
          <label style="display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px">NIP <span style="font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink-3)">— opsional (non-pegawai boleh kosong)</span></label>
          <input type="text" inputmode="numeric" value="{{ vPicNip }}" onInput="{{ onPicNip }}" placeholder="19xxxxxxxxxxxxxxxx" style="width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12.5px;outline:none" style-focus="border-color:var(--navy-3)">
        </div>
        <div>
          <label style="display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px">No. WhatsApp <span style="color:var(--red)">*</span></label>
          <input type="tel" inputmode="tel" value="{{ vPicWa }}" onInput="{{ onPicWa }}" placeholder="0812xxxxxxx" style="width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12.5px;outline:none" style-focus="border-color:var(--navy-3)">
          <div style="margin-top:5px;font-size:11px;color:{{ waHintColor }}">{{ waHint }}</div>
        </div>
      </div>
    </div>

    <button type="button" onClick="{{ toggleRevisi }}" style="display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1px dashed {{ revisiBorder }};background:{{ revisiBg }};cursor:pointer;font-family:Manrope" style-hover="filter:brightness(.98)">
      <span style="width:20px;height:20px;flex:0 0 auto;border-radius:6px;border:2px solid {{ revisiInk }};background:{{ revisiBoxBg }};color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800">{{ revisiMark }}</span>
      <span style="min-width:0">
        <span style="display:block;font-size:12.5px;font-weight:800;color:{{ revisiInk }}">{{ revisiJudul }}</span>
        <span style="display:block;margin-top:2px;font-size:11.5px;line-height:1.55;color:var(--ink-2);text-wrap:pretty">Revisi bersifat kondisional — berkas tetap berada pada tahapnya, hanya diberi bendera ⚑. Berkas yang lancar tidak perlu melewati revisi sama sekali.</span>
      </span>
    </button>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
      <div>
        <label style="display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px">{{ labelCatatan }}</label>
        <input type="text" value="{{ vCatatan }}" onInput="{{ onCatatan }}" placeholder="Contoh: berkas diterima dari Tim Kerja" style="width:100%;height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:Manrope;font-size:13px;outline:none" style-focus="border-color:var(--navy-3)">
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px">Link Berkas (Drive/PDF)</label>
        <input type="url" value="{{ vBerkas }}" onInput="{{ onBerkas }}" placeholder="https://drive.google.com/file/d/..." style="width:100%;height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:Manrope;font-size:12.5px;outline:none" style-focus="border-color:var(--navy-3)">
      </div>
    </div>

    <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="padding:12px 14px;border-radius:11px;background:var(--red-bg);border:1px solid var(--red);font-size:12.5px;overflow-wrap:anywhere">{{ error }}</div>
    </sc-if>
    <sc-if value="{{ hasSuccess }}" hint-placeholder-val="{{ false }}">
      <div role="status" style="padding:12px 14px;border-radius:11px;background:var(--green-bg);border:1px solid var(--green);font-size:12.5px;overflow-wrap:anywhere">{{ success }}</div>
    </sc-if>

    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
      <button type="button" onClick="{{ onSubmit }}" disabled="{{ busy }}" style="height:44px;padding:0 20px;border-radius:11px;border:none;background:var(--navy);color:#fff;font-family:Manrope;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:9px;opacity:{{ busyOpacity }}" style-hover="transform:translateY(-1px)">
        <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
          <span style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin2 700ms linear infinite;display:inline-block"></span>
        </sc-if>
        <span>{{ submitLabel }}</span>
      </button>
      <sc-if value="{{ isEditing }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ onCancel }}" style="height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:Manrope;font-size:13px;font-weight:600;cursor:pointer" style-hover="border-color:var(--navy-3)">Batalkan Edit</button>
      </sc-if>
      <sc-if value="{{ notEditing }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ onReset }}" style="height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-family:Manrope;font-size:13px;font-weight:600;cursor:pointer" style-hover="border-color:var(--navy-3)">Bersihkan</button>
      </sc-if>
      <span style="font-size:11.5px;color:var(--ink-3);text-wrap:pretty">{{ hint }}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:560},&quot;komponenOptions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{value:string,label:string}[]&quot;},&quot;values&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ButirForm&quot;},&quot;editingId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string | null&quot;},&quot;busy&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;success&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;seed&quot;,&quot;appscript&quot;,&quot;gviz&quot;],&quot;default&quot;:&quot;seed&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;judul&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Catat Butir Kegiatan Baru&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onField&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(field: string, value: string) =&gt; void&quot;},&quot;onSubmit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onReset&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onCancel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
/**
 * AdminControls — form input & edit Butir Kegiatan (dipakai Admin/TU).
 *
 * Presentational: seluruh nilai & handler dikirim dari parent (Admin Panel),
 * sehingga komponen ini bisa dipasang di halaman lain tanpa membawa state.
 *
 * Props: komponenOptions[], values{komponen,nama,nominal,tanggal,status,catatan,berkas},
 *        onField(field, value), onSubmit(), onReset(), onCancel(),
 *        editingId (string|null), busy, error, success, mode
 *
 * ⚡ INTEGRASI API: parent yang memanggil addButir()/updateButir() di data-source.js.
 * Tukar isi fungsi itu bila backend berpindah dari Apps Script ke REST/WebSocket.
 */
const TAHAP_OPT = [
  { value: 'TU', label: '1. Verifikasi Tim TU Pusdatin KP' },
  { value: 'KEUANGAN', label: '2. Verifikasi Tim Keuangan' },
  { value: 'SP2D', label: '3. SP2D' }
];

function rapikanWa(v) {
  let t = String(v ?? '').replace(/[^0-9+]/g, '').replace(/^\+/, '');
  if (!t) return '';
  if (t.charAt(0) === '0') t = '62' + t.slice(1);
  else if (t.slice(0, 2) !== '62' && t.length <= 12) t = '62' + t;
  return t;
}

class Component extends DCLogic {
  /* Opsi <select> disisipkan setelah commit — sinkronkan nilainya tiap render. */
  componentDidMount() { this.sinkron(); }
  componentDidUpdate() { this.sinkron(); }
  sinkron() {
    requestAnimationFrame(() => {
      const v = this.props.values || {};
      const set = (el, val) => { if (el && el.options.length && el.value !== val) el.value = val; };
      set(this.elKomponen, v.komponen ?? '');
      set(this.elStatus, v.status ?? 'TU');
    });
  }

  field(name) {
    return (e) => this.props.onField && this.props.onField(name, e.target.value);
  }
  renderVals() {
    const v = this.props.values || {};
    const editing = !!this.props.editingId;
    const mode = this.props.mode || 'seed';
    const live = mode === 'appscript';
    return {
      judul: editing ? 'Edit Butir Kegiatan · ' + this.props.editingId : (this.props.judul ?? 'Catat Butir Kegiatan Baru'),
      subjudul: editing
        ? 'Perbarui isi butir, lalu simpan. Tahapan berkas juga bisa diubah langsung dari tabel.'
        : 'Dipakai Admin/TU saat menerima berkas pertanggungjawaban dari Tim Kerja.',
      modeLabel: live ? 'TERSAMBUNG · Google Sheets' : 'MODE ' + mode.toUpperCase() + ' · simulasi lokal',
      modeColor: live ? 'var(--green)' : 'var(--amber)',
      modeBg: live ? 'var(--green-bg)' : 'var(--amber-bg)',

      komponenOptions: this.props.komponenOptions || [],
      statusOptions: TAHAP_OPT,
      vId: v.id ?? '',
      onId: this.field('id'),
      idBg: editing ? 'var(--surface-3)' : 'var(--surface-2)',
      idHint: editing
        ? 'Nomor dokumen tidak dapat diubah saat mengedit — hapus lalu catat ulang bila keliru.'
        : 'Gunakan nomor dokumen/surat resmi sebagai ID butir. Harus unik.',
      // Sinkronkan <select> setelah opsi ter-render.
      refKomponen: (el) => { this.elKomponen = el; if (el && el.options.length) el.value = v.komponen ?? ''; },
      refStatus: (el) => { this.elStatus = el; if (el && el.options.length) el.value = v.status ?? 'TU'; },
      vKomponen: v.komponen ?? '',
      vNama: v.nama ?? '',
      vNominal: v.nominal ?? '',
      vTanggal: v.tanggal ?? '',
      vStatus: v.status ?? 'TU',
      vPicNama: v.picNama ?? '',
      vPicNip: v.picNip ?? '',
      vPicWa: v.picWa ?? '',
      onPicNama: this.field('picNama'),
      onPicNip: this.field('picNip'),
      onPicWa: this.field('picWa'),
      waHint: v.picWa ? 'Akan dikirim ke +' + rapikanWa(v.picWa) : 'Boleh 08… atau 62… — otomatis dirapikan.',
      waHintColor: v.picWa ? 'var(--green)' : 'var(--ink-3)',
      vCatatan: v.catatan ?? '',
      labelCatatan: v.revisi ? 'Catatan / alasan revisi' : 'Catatan',
      revisiJudul: v.revisi ? 'Ditandai perlu revisi' : 'Tandai perlu revisi (opsional)',
      revisiMark: v.revisi ? '⚑' : '',
      revisiInk: v.revisi ? 'var(--red)' : 'var(--ink-3)',
      revisiBorder: v.revisi ? 'var(--red)' : 'var(--line)',
      revisiBg: v.revisi ? 'var(--red-bg)' : 'var(--surface-2)',
      revisiBoxBg: v.revisi ? 'var(--red)' : 'transparent',
      toggleRevisi: () => this.props.onField && this.props.onField('revisi', !v.revisi),
      vBerkas: v.berkas ?? '',
      onKomponen: this.field('komponen'),
      onNama: this.field('nama'),
      onNominal: this.field('nominal'),
      onTanggal: this.field('tanggal'),
      onStatus: this.field('status'),
      onCatatan: this.field('catatan'),
      onBerkas: this.field('berkas'),

      hasError: !!this.props.error,
      error: this.props.error || '',
      hasSuccess: !!this.props.success,
      success: this.props.success || '',
      busy: !!this.props.busy,
      busyOpacity: this.props.busy ? '.7' : '1',
      submitLabel: this.props.busy ? 'Menyimpan...' : (editing ? 'Simpan Perubahan' : 'Simpan Butir Kegiatan'),
      isEditing: editing,
      notEditing: !editing,
      onSubmit: this.props.onSubmit || (() => {}),
      onReset: this.props.onReset || (() => {}),
      onCancel: this.props.onCancel || (() => {}),
      hint: live ? 'Tersimpan ke sheet "Butir" dan langsung tampil di dashboard.' : 'Mode simulasi: perubahan hanya tampil di layar ini.'
    };
  }
}
</script>
</body>
</html>
